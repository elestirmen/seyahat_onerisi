<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Seyahat Öneri Sistemi</title>
  <style>
    :root { --tab-h: 48px; }
    body { margin:0; font:16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .tabs { display:flex; gap:8px; border-bottom:1px solid #ddd; padding:8px; height:var(--tab-h); align-items:center; }
    .tab { padding:8px 12px; border-radius:8px; cursor:pointer; user-select:none; color:#111; background:#f5f5f5; }
    .tab.active { background:#111; color:#fff; }
    .panes { position:relative; height: calc(100vh - var(--tab-h)); }
    .pane { position:absolute; inset:0; display:none; }
    .pane.active { display:block; }
    .pane iframe { width:100%; height:100%; border:0; background:#fff; }
  </style>
</head>
<body>
  <nav class="tabs">
    <div class="tab active" data-target="#pane-personal">Kişiye Göre</div>
    <div class="tab" data-target="#pane-predef">Hazır Rotalar</div>
  </nav>
  <section class="panes">
    <div class="pane active" id="pane-personal">
      <iframe src="personal_routes.html"></iframe>
    </div>
    <div class="pane" id="pane-predef">
      <iframe src="predefined_routes.html" loading="lazy"></iframe>
    </div>
  </section>
  <script>
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const panes = Array.from(document.querySelectorAll('.pane'));
    tabs.forEach(t => t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      panes.forEach(p => p.classList.remove('active'));
      t.classList.add('active');
      const pane = document.querySelector(t.dataset.target);
      if (pane) pane.classList.add('active');
    }));

    // Parent <-> iframe bridge (optional skeleton)
    window.addEventListener('message', (e) => {
      // Future: handle notifications from iframes
      // console.debug('Shell received:', e.data);
    });
  </script>
</body>
</html>
