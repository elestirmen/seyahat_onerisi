  <style>
    :root {
      color-scheme: light;
      --shell-h: 76px;
      --ink: #17231f;
      --forest: #1f352c;
      --cream: #f6f2e9;
      --paper: #fffdf8;
      --line: #ded5c6;
      --copper: #b86e3b;
      --muted: #737b74;
      --serif: Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      --sans: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font: 16px var(--sans);
      background: var(--cream);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .app-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      min-height: var(--shell-h);
      padding: 10px clamp(16px, 3vw, 44px);
      box-sizing: border-box;
      border-bottom: 1px solid rgba(51, 62, 55, 0.1);
      background: rgba(255, 253, 248, 0.94);
      box-shadow: 0 8px 30px rgba(32, 42, 35, 0.06);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 245px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      flex: 0 0 42px;
      border-radius: 50%;
      background: var(--forest);
      box-shadow: 0 8px 20px rgba(31, 53, 44, 0.18);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: '';
      position: absolute;
      bottom: 10px;
      width: 11px;
      height: 17px;
      border-radius: 50% 50% 44% 44% / 32% 32% 68% 68%;
      background: #d8b27b;
      transform: rotate(8deg);
    }

    .brand-mark::before {
      left: 10px;
      height: 13px;
      transform: rotate(-8deg);
    }

    .brand-mark::after {
      right: 10px;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand-name {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    .brand-place {
      margin-top: 5px;
      color: var(--copper);
      font-size: 0.61rem;
      font-weight: 780;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin: 0 auto;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f2ede4;
    }

    .tab {
      min-height: 42px;
      padding: 9px 20px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      color: #69736c;
      background: transparent;
      font: 680 0.82rem var(--sans);
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tab:hover:not(.active) {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.62);
    }

    .tab.active {
      background: var(--forest);
      color: white;
      box-shadow: 0 7px 16px rgba(31, 53, 44, 0.18);
    }

    .tab:focus-visible,
    .privacy-link:focus-visible {
      outline: 3px solid rgba(184, 110, 59, 0.42);
      outline-offset: 3px;
    }

    .app-actions {
      display: flex;
      min-width: 245px;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .region-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 650;
    }

    .region-status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6e927d;
      box-shadow: 0 0 0 4px rgba(110, 146, 125, 0.12);
    }

    .panes {
      position: relative;
      min-height: 0;
      background: var(--cream);
    }

    .pane {
      position: absolute;
      inset: 0;
      display: none;
    }

    .pane.active {
      display: block;
    }

    .pane iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--cream);
    }

    .privacy-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 0.72rem;
      font-weight: 680;
      text-decoration: none;
      transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }

    .privacy-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      color: var(--copper);
    }

    .privacy-link:hover .privacy-icon {
      color: inherit;
    }

    .privacy-link:hover {
      border-color: var(--copper);
      background: #fffaf1;
      color: var(--copper);
    }

    @media (max-width: 820px) {
      :root { --shell-h: 68px; }

      .app-bar {
        gap: 12px;
        padding: 8px 12px;
      }

      .brand,
      .app-actions {
        min-width: auto;
      }

      .brand-copy,
      .region-status,
      .privacy-label {
        display: none;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .tabs {
        min-width: 0;
        flex: 1;
      }

      .tab {
        min-width: 0;
        flex: 1;
        padding: 8px 10px;
        font-size: 0.72rem;
        white-space: nowrap;
      }

      .privacy-link {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        padding: 0;
        gap: 0;
      }

      .privacy-icon {
        width: 17px;
        height: 17px;
        flex-basis: 17px;
      }
    }

    @media (max-width: 460px) {
      .app-bar {
        gap: 8px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .brand-mark::before {
        left: 8px;
      }

      .brand-mark::after {
        right: 8px;
      }

      .privacy-link {
        width: 36px;
        height: 36px;
      }

      .tab {
        font-size: 0.67rem;
        padding-inline: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>

<body>
  <header class="app-bar">
    <div class="brand" aria-label="Kapadokya Seyahat Rehberi">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-copy">
        <span class="brand-name">Seyahat Rehberi</span>
        <span class="brand-place">Kapadokya · Ürgüp</span>
      </span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Keşif bölümleri">
      <button type="button" class="tab active" data-target="#pane-personal" role="tab" tabindex="0"
        id="tab-personal" aria-controls="pane-personal" aria-selected="true">Size Özel</button>
      <button type="button" class="tab" data-target="#pane-predef" role="tab" tabindex="-1"
        id="tab-predef" aria-controls="pane-predef" aria-selected="false">Seçilmiş Rotalar</button>
    </nav>
    <div class="app-actions">
      <span class="region-status">Bölge rehberi aktif</span>
      <a class="privacy-link" href="policy.html" aria-label="Gizlilik politikasını aç"><svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.7 5.2 5.2v6.1c0 4.3 2.8 8.2 6.8 9.5 4-1.3 6.8-5.2 6.8-9.5V5.2L12 2.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.2 12.1l2.1 2.1 3.5-3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="privacy-label">Gizlilik</span></a>
    </div>
  </header>
  <section class="panes">
    <div class="pane active" id="pane-personal" role="tabpanel" aria-labelledby="tab-personal">
      <iframe src="personal_routes.html?v=20260731-review3" allow="geolocation; fullscreen; notifications" title="Size özel keşifler"></iframe>
    </div>
    <div class="pane" id="pane-predef" role="tabpanel" aria-labelledby="tab-predef" hidden>
      <iframe src="predefined_routes.html?v=20260731-premium1" loading="lazy" allow="geolocation; fullscreen; notifications" title="Seçilmiş rotalar"></iframe>
    </div>
  </section>
  <script>
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const panes = Array.from(document.querySelectorAll('.pane'));

    function syncTabAria() {
      tabs.forEach(tab => {
        const isActive = tab.classList.contains('active');
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
        tab.setAttribute('tabindex', isActive ? '0' : '-1');
      });
      panes.forEach(pane => {
        const isActive = pane.classList.contains('active');
        if (isActive) pane.removeAttribute('hidden');
        else pane.setAttribute('hidden', '');
      });
    }

    tabs.forEach(t => {
      t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.remove('active'));
        panes.forEach(p => p.classList.remove('active'));
        t.classList.add('active');
        const pane = document.querySelector(t.dataset.target);
        if (pane) pane.classList.add('active');
        syncTabAria();
      });

      // Keyboard arrow navigation between tabs (WAI-ARIA tabs pattern)
      t.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft' && e.key !== 'Home' && e.key !== 'End') return;
        e.preventDefault();
        const currentIdx = tabs.indexOf(t);
        let nextIdx = currentIdx;
        if (e.key === 'ArrowRight') nextIdx = (currentIdx + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') nextIdx = (currentIdx - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') nextIdx = 0;
        else if (e.key === 'End') nextIdx = tabs.length - 1;
        tabs[nextIdx].focus();
        tabs[nextIdx].click();
      });
    });

    function activatePane(targetSelector) {
      const targetTab = tabs.find(tab => tab.dataset.target === targetSelector);
      const pane = document.querySelector(targetSelector);
      if (!targetTab || !pane) return;

      tabs.forEach(x => x.classList.remove('active'));
      panes.forEach(p => p.classList.remove('active'));
      targetTab.classList.add('active');
      pane.classList.add('active');
      syncTabAria();
    }

    function sendToPredefinedFrame(message) {
      const iframe = document.querySelector('#pane-predef iframe');
      if (!iframe) return;

      const send = () => {
        try {
          iframe.contentWindow.postMessage(message, window.location.origin);
        } catch (_) {}
      };

      iframe.addEventListener('load', send, { once: true });
      setTimeout(send, 250);
      setTimeout(send, 900);
    }

    // Parent <-> iframe bridge
    window.addEventListener('message', (e) => {
      const personalFrame = document.querySelector('#pane-personal iframe');
      if (
        e.origin !== window.location.origin ||
        !personalFrame ||
        e.source !== personalFrame.contentWindow ||
        !e.data ||
        typeof e.data !== 'object'
      ) {
        return;
      }

      const message = e.data;
      if (message.type === 'intent:predefined-filter') {
        activatePane('#pane-predef');
        sendToPredefinedFrame({
          type: 'predefined:apply-filters',
          filters: message.filters || {},
          source: message.source || 'shell'
        });
      }
    });
  </script>
