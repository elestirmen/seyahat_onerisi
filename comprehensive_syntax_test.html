<!DOCTYPE html>
<html>
<head>
    <title>Kapsamlı Syntax Testi</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔍 Kapsamlı JavaScript Syntax Testi</h1>
    
    <div class="test-section">
        <h3>📋 Test Sonuçları</h3>
        <div id="results">Test başlatılıyor...</div>
    </div>
    
    <div class="test-section">
        <h3>🔧 Detaylı Bilgiler</h3>
        <div id="details">Yükleniyor...</div>
    </div>
    
    <script>
        const results = document.getElementById('results');
        const details = document.getElementById('details');
        
        let errors = [];
        let loadedScripts = [];
        let testResults = [];
        
        // Global error handler
        window.addEventListener('error', function(e) {
            const error = `❌ ${e.filename}:${e.lineno}:${e.colno} - ${e.message}`;
            errors.push(error);
            console.error('Caught error:', error);
            updateResults();
        });
        
        // Unhandled promise rejection handler
        window.addEventListener('unhandledrejection', function(e) {
            const error = `❌ Unhandled Promise Rejection: ${e.reason}`;
            errors.push(error);
            console.error('Caught promise rejection:', error);
            updateResults();
        });
        
        function updateResults() {
            let html = '';
            
            if (errors.length === 0 && loadedScripts.length > 0) {
                html += '<div class="success">✅ Tüm JavaScript dosyaları başarıyla yüklendi!</div>';
            } else if (errors.length > 0) {
                html += '<div class="error">❌ JavaScript hataları bulundu:</div>';
                errors.forEach(error => {
                    html += `<div class="error">${error}</div>`;
                });
            }
            
            if (loadedScripts.length > 0) {
                html += '<div class="success">📜 Yüklenen dosyalar:</div>';
                loadedScripts.forEach(script => {
                    html += `<div class="success">  ✅ ${script}</div>`;
                });
            }
            
            results.innerHTML = html;
            
            // Update details
            let detailsHtml = '';
            testResults.forEach(result => {
                detailsHtml += `<div class="${result.type}">${result.message}</div>`;
            });
            details.innerHTML = detailsHtml;
        }
        
        function addTestResult(message, type = 'success') {
            testResults.push({ message, type });
            updateResults();
        }
        
        // Test functions availability
        function testFunctions() {
            const functionsToTest = [
                'window.getCategoryStyle',
                'window.showRouteDetails', 
                'window.RouteDetailsModal',
                'window.testRouteModal',
                'window.testMobileTabSwitching'
            ];
            
            functionsToTest.forEach(funcName => {
                try {
                    const func = eval(funcName);
                    if (typeof func !== 'undefined') {
                        addTestResult(`✅ ${funcName} mevcut`, 'success');
                    } else {
                        addTestResult(`❌ ${funcName} tanımsız`, 'error');
                    }
                } catch (e) {
                    addTestResult(`❌ ${funcName} test hatası: ${e.message}`, 'error');
                }
            });
        }
        
        // Load scripts sequentially
        const scripts = [
            'static/js/poi-categories.js',
            'static/js/route-details-modal.js', 
            'static/js/poi_recommendation_system.js'
        ];
        
        let currentScriptIndex = 0;
        
        function loadNextScript() {
            if (currentScriptIndex >= scripts.length) {
                // All scripts loaded, run tests
                setTimeout(() => {
                    testFunctions();
                    updateResults();
                }, 1000);
                return;
            }
            
            const src = scripts[currentScriptIndex];
            const script = document.createElement('script');
            script.src = src;
            
            script.onload = () => {
                loadedScripts.push(src);
                addTestResult(`✅ Yüklendi: ${src}`, 'success');
                currentScriptIndex++;
                loadNextScript();
            };
            
            script.onerror = () => {
                const error = `❌ Yüklenemedi: ${src}`;
                errors.push(error);
                addTestResult(error, 'error');
                currentScriptIndex++;
                loadNextScript();
            };
            
            document.head.appendChild(script);
        }
        
        // Start loading
        addTestResult('🚀 JavaScript dosyaları yükleniyor...', 'warning');
        loadNextScript();
        
        // Final check after 5 seconds
        setTimeout(() => {
            if (errors.length === 0) {
                addTestResult('🎉 Tüm testler başarılı! Sistem hazır.', 'success');
            } else {
                addTestResult(`⚠️ ${errors.length} hata bulundu. Lütfen kontrol edin.`, 'error');
            }
        }, 5000);
    </script>
</body>
</html>
