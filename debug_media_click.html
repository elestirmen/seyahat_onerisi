<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Click Debug - Route Details Modal</title>
    <link rel="stylesheet" href="static/css/route-details-modal.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .debug-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .debug-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .status-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #ddd;
        }

        .status-item.success {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .status-item.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }

        .status-item.warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .status-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        .test-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: background 0.2s ease;
        }

        .test-btn:hover {
            background: #1d4ed8;
        }

        .test-btn.danger {
            background: #dc3545;
        }

        .test-btn.danger:hover {
            background: #c82333;
        }

        .debug-console {
            margin-top: 30px;
            padding: 20px;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }

        .debug-console h4 {
            margin: 0 0 15px 0;
            color: #60a5fa;
        }

        .debug-log {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        .debug-log.error {
            background: rgba(220,53,69,0.2);
            border-left: 3px solid #dc3545;
        }

        .debug-log.success {
            background: rgba(40,167,69,0.2);
            border-left: 3px solid #28a745;
        }

        .debug-log.warning {
            background: rgba(255,193,7,0.2);
            border-left: 3px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <div class="debug-header">
            <h1>🔍 Media Click Debug Tool</h1>
            <p>Diagnose media click issues in route details modal</p>
        </div>

        <div class="status-section">
            <h3>System Status</h3>

            <div id="modalStatus" class="status-item">
                <span class="status-icon">⏳</span>
                <div>
                    <strong>Modal System:</strong> Checking...
                </div>
            </div>

            <div id="instanceStatus" class="status-item">
                <span class="status-icon">⏳</span>
                <div>
                    <strong>Modal Instance:</strong> Checking...
                </div>
            </div>

            <div id="methodStatus" class="status-item">
                <span class="status-icon">⏳</span>
                <div>
                    <strong>showMediaViewer Method:</strong> Checking...
                </div>
            </div>
        </div>

        <div class="test-section" style="margin-top: 30px;">
            <h3>Test Actions</h3>

            <button class="test-btn" onclick="runFullDiagnostic()">🔧 Run Full Diagnostic</button>
            <button class="test-btn" onclick="testMediaViewerDirectly()">🎬 Test Media Viewer Directly</button>
            <button class="test-btn" onclick="clearDebugLog()">🧹 Clear Debug Log</button>
            <button class="test-btn danger" onclick="resetModalSystem()">🔄 Reset Modal System</button>
        </div>

        <div class="debug-console">
            <h4>📋 Debug Log</h4>
            <div id="debugOutput">
                <div class="debug-log">Debug tool initialized. Click "Run Full Diagnostic" to start testing.</div>
            </div>
        </div>
    </div>

    <!-- Route Details Modal JS -->
    <script src="static/js/route-details-modal.js"></script>

    <script>
        let debugLogs = [];

        function addDebugLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            debugLogs.push({ message: logEntry, type });

            const debugOutput = document.getElementById('debugOutput');
            const logDiv = document.createElement('div');
            logDiv.className = `debug-log ${type}`;
            logDiv.textContent = logEntry;
            debugOutput.appendChild(logDiv);
            debugOutput.scrollTop = debugOutput.scrollHeight;
        }

        function updateStatus(elementId, status, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `status-item ${type}`;
            element.innerHTML = `
                <span class="status-icon">${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : '⏳'}</span>
                <div>
                    <strong>${element.querySelector('strong').textContent.split(':')[0]}:</strong> ${message}
                </div>
            `;
        }

        function checkModalSystem() {
            addDebugLog('🔍 Checking modal system...');

            // Check if RouteDetailsModal class exists
            if (typeof RouteDetailsModal === 'undefined') {
                updateStatus('modalStatus', 'error', 'RouteDetailsModal class not found', 'error');
                addDebugLog('❌ RouteDetailsModal class is not defined', 'error');
                return false;
            } else {
                updateStatus('modalStatus', 'success', 'RouteDetailsModal class found', 'success');
                addDebugLog('✅ RouteDetailsModal class found', 'success');
            }

            // Check if instance exists
            if (typeof window.routeDetailsModalInstance === 'undefined') {
                updateStatus('instanceStatus', 'warning', 'Instance not initialized', 'warning');
                addDebugLog('⚠️ window.routeDetailsModalInstance is not defined', 'warning');

                // Try to create instance
                try {
                    addDebugLog('🚀 Attempting to create modal instance...');
                    window.routeDetailsModalInstance = RouteDetailsModal.getInstance();
                    updateStatus('instanceStatus', 'success', 'Instance created successfully', 'success');
                    addDebugLog('✅ Modal instance created successfully', 'success');
                } catch (error) {
                    updateStatus('instanceStatus', 'error', 'Failed to create instance: ' + error.message, 'error');
                    addDebugLog('❌ Failed to create modal instance: ' + error.message, 'error');
                    return false;
                }
            } else {
                updateStatus('instanceStatus', 'success', 'Instance exists', 'success');
                addDebugLog('✅ Modal instance exists', 'success');
            }

            // Check if showMediaViewer method exists
            if (typeof window.routeDetailsModalInstance.showMediaViewer !== 'function') {
                updateStatus('methodStatus', 'error', 'showMediaViewer method not found', 'error');
                addDebugLog('❌ showMediaViewer method not found on instance', 'error');
                return false;
            } else {
                updateStatus('methodStatus', 'success', 'Method available', 'success');
                addDebugLog('✅ showMediaViewer method found', 'success');
            }

            return true;
        }

        function runFullDiagnostic() {
            addDebugLog('🔧 Starting full diagnostic...');

            if (checkModalSystem()) {
                addDebugLog('✅ Modal system diagnostic completed successfully', 'success');
            } else {
                addDebugLog('❌ Modal system diagnostic found issues', 'error');
            }
        }

        function testMediaViewerDirectly() {
            addDebugLog('🎬 Testing media viewer directly...');

            if (!checkModalSystem()) {
                addDebugLog('❌ Cannot test media viewer - modal system not ready', 'error');
                return;
            }

            try {
                addDebugLog('🚀 Calling showMediaViewer with test data...');
                const testUrl = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjNmNGY2Ii8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGR5PSIuM2VtIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjOWNhM2FmIiBmb250LXNpemU9IjE2Ij5UZXN0IE1lZGlhPC90ZXh0Pjwvc3ZnPg==';
                window.routeDetailsModalInstance.showMediaViewer(testUrl, 'image', 0);
                addDebugLog('✅ showMediaViewer called successfully', 'success');
            } catch (error) {
                addDebugLog('❌ Error calling showMediaViewer: ' + error.message, 'error');
            }
        }

        function clearDebugLog() {
            debugLogs = [];
            document.getElementById('debugOutput').innerHTML = '<div class="debug-log">Debug log cleared.</div>';
        }

        function resetModalSystem() {
            addDebugLog('🔄 Resetting modal system...');

            try {
                // Remove existing instance
                if (window.routeDetailsModalInstance) {
                    delete window.routeDetailsModalInstance;
                    addDebugLog('✅ Existing instance removed', 'success');
                }

                // Remove any existing modal elements
                const existingModals = document.querySelectorAll('.route-details-modal, .media-viewer-modal');
                existingModals.forEach(modal => {
                    modal.remove();
                    addDebugLog('🗑️ Removed existing modal element', 'success');
                });

                // Reset status indicators
                updateStatus('modalStatus', 'info', 'Ready to reinitialize', 'info');
                updateStatus('instanceStatus', 'info', 'Ready to recreate', 'info');
                updateStatus('methodStatus', 'info', 'Ready to check', 'info');

                addDebugLog('✅ Modal system reset completed', 'success');
            } catch (error) {
                addDebugLog('❌ Error during reset: ' + error.message, 'error');
            }
        }

        // Initialize diagnostic on page load
        window.addEventListener('load', function() {
            addDebugLog('📦 Debug tool loaded, checking modal system...');
            setTimeout(checkModalSystem, 1000); // Wait for scripts to load
        });

        // Add global error handler
        window.addEventListener('error', function(event) {
            addDebugLog('🚨 Global error: ' + event.error.message, 'error');
        });

        // Add unhandled promise rejection handler
        window.addEventListener('unhandledrejection', function(event) {
            addDebugLog('🚨 Unhandled promise rejection: ' + event.reason, 'error');
        });
    </script>
</body>
</html>
