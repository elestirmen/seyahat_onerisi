name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install Flask Flask-Session Flask-SocketIO flask-cors psycopg2 python-dotenv bcrypt
          pip install ruff pytest pyyaml

      - name: Validate project
        run: make validate

      - name: Run tests
        run: make test

      - name: Ruff lint (non-blocking)
        run: ruff check . || true

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install -g eslint

      - name: Run ESLint (best effort)
        run: eslint static/js --max-warnings=0 || true
