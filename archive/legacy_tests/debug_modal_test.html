<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Modal Debug Test</title>
    <link rel="stylesheet" href="static/css/route-details-modal.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-button {
            background: #4338ca;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .test-button:hover {
            background: #3730a3;
        }
        .debug-info {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #ddd;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Route Details Modal Debug Test</h1>
    
    <div class="debug-info">
        <h3>Test Controls</h3>
        <button class="test-button" onclick="testModalCreation()">Test Modal Creation</button>
        <button class="test-button" onclick="testModalShow()">Test Modal Show</button>
        <button class="test-button" onclick="testMobileDetection()">Test Mobile Detection</button>
        <button class="test-button" onclick="checkDependencies()">Check Dependencies</button>
    </div>

    <div id="debugOutput" class="debug-info">
        <h3>Debug Output</h3>
        <div id="debugLog"></div>
    </div>

    <!-- Load dependencies -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="static/js/route-details-modal.js"></script>

    <script>
        const debugLog = document.getElementById('debugLog');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            debugLog.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            console.log(`[${timestamp}] ${message}`);
        }

        function checkDependencies() {
            log('=== Checking Dependencies ===');
            
            // Check Leaflet
            if (typeof L !== 'undefined') {
                log('✅ Leaflet loaded successfully', 'success');
            } else {
                log('❌ Leaflet not loaded', 'error');
            }
            
            // Check Chart.js
            if (typeof Chart !== 'undefined') {
                log('✅ Chart.js loaded successfully', 'success');
            } else {
                log('❌ Chart.js not loaded', 'error');
            }
            
            // Check RouteDetailsModal
            if (typeof RouteDetailsModal !== 'undefined') {
                log('✅ RouteDetailsModal class loaded successfully', 'success');
            } else {
                log('❌ RouteDetailsModal class not loaded', 'error');
            }
            
            // Check window object
            if (window.routeDetailsModalInstance) {
                log('✅ Modal instance exists', 'success');
            } else {
                log('⚠️ Modal instance not created yet', 'info');
            }
        }

        function testMobileDetection() {
            log('=== Testing Mobile Detection ===');
            const isMobile = window.innerWidth <= 768;
            log(`Screen width: ${window.innerWidth}px`);
            log(`Is mobile: ${isMobile}`, isMobile ? 'info' : 'success');
            log(`User agent: ${navigator.userAgent}`);
        }

        function testModalCreation() {
            log('=== Testing Modal Creation ===');
            try {
                if (typeof RouteDetailsModal === 'undefined') {
                    log('❌ RouteDetailsModal class not available', 'error');
                    return;
                }
                
                const modal = RouteDetailsModal.getInstance();
                if (modal) {
                    log('✅ Modal instance created successfully', 'success');
                    log(`Modal element exists: ${!!modal.modal}`, modal.modal ? 'success' : 'error');
                    
                    // Check if modal HTML is in DOM
                    const modalElement = document.getElementById('routeDetailsModal');
                    if (modalElement) {
                        log('✅ Modal HTML element found in DOM', 'success');
                    } else {
                        log('❌ Modal HTML element not found in DOM', 'error');
                    }
                } else {
                    log('❌ Failed to create modal instance', 'error');
                }
            } catch (error) {
                log(`❌ Error creating modal: ${error.message}`, 'error');
                console.error('Modal creation error:', error);
            }
        }

        function testModalShow() {
            log('=== Testing Modal Show ===');
            try {
                const modal = RouteDetailsModal.getInstance();
                if (!modal) {
                    log('❌ Modal instance not available', 'error');
                    return;
                }
                
                // Test route data
                const testRouteData = {
                    id: 158,
                    name: "Test Route",
                    description: "Test route for debugging",
                    total_distance: 10.5,
                    estimated_duration: 3600,
                    poi_count: 5,
                    difficulty_level: 2,
                    pois: [
                        {
                            name: "Test POI",
                            category: "dogal_miras",
                            description: "Test POI description",
                            latitude: 38.6431,
                            longitude: 34.8286
                        }
                    ],
                    geometry: {
                        type: "LineString",
                        coordinates: [
                            [34.8286, 38.6431],
                            [34.8300, 38.6440],
                            [34.8320, 38.6450]
                        ]
                    },
                    elevation_profile: {
                        points: [
                            { distance: 0, elevation: 1000, lat: 38.6431, lng: 34.8286 },
                            { distance: 100, elevation: 1010, lat: 38.6440, lng: 34.8300 },
                            { distance: 200, elevation: 1020, lat: 38.6450, lng: 34.8320 }
                        ]
                    }
                };
                
                log('Attempting to show modal with test data...');
                modal.show(testRouteData);
                log('✅ Modal show method called successfully', 'success');
                
                // Check if modal is visible
                setTimeout(() => {
                    const modalElement = document.getElementById('routeDetailsModal');
                    if (modalElement && modalElement.classList.contains('show')) {
                        log('✅ Modal is visible', 'success');
                        
                        // Check map container
                        const mapContainer = document.getElementById('routeModalMap');
                        if (mapContainer) {
                            log('✅ Map container found', 'success');
                            log(`Map container dimensions: ${mapContainer.offsetWidth}x${mapContainer.offsetHeight}`);
                            
                            if (mapContainer.offsetWidth === 0 || mapContainer.offsetHeight === 0) {
                                log('❌ Map container has zero dimensions', 'error');
                            } else {
                                log('✅ Map container has proper dimensions', 'success');
                            }
                        } else {
                            log('❌ Map container not found', 'error');
                        }
                        
                        // Check elevation chart container
                        const elevationContainer = document.getElementById('routeModalElevationContainer');
                        if (elevationContainer) {
                            log('✅ Elevation container found', 'success');
                        } else {
                            log('❌ Elevation container not found', 'error');
                        }
                        
                    } else {
                        log('❌ Modal is not visible', 'error');
                    }
                }, 1000);
                
            } catch (error) {
                log(`❌ Error showing modal: ${error.message}`, 'error');
                console.error('Modal show error:', error);
            }
        }

        // Auto-run dependency check on load
        window.addEventListener('load', () => {
            log('=== Page Loaded ===');
            checkDependencies();
        });

        // Capture console errors
        window.addEventListener('error', (event) => {
            log(`❌ JavaScript Error: ${event.error.message} at ${event.filename}:${event.lineno}`, 'error');
        });

        // Capture unhandled promise rejections
        window.addEventListener('unhandledrejection', (event) => {
            log(`❌ Unhandled Promise Rejection: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
