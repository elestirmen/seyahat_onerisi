<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Yönetimi - Gelişmiş Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared map styles for 360° markers -->
    <link rel="stylesheet" href="static/css/poi_recommendation_system.css">
    <script src="static/js/admin_token.js"></script>
    <style>
        :root {
            --route-primary: #2563eb;
            --route-secondary: #64748b;
            --route-success: #059669;
            --route-danger: #dc2626;
            --route-warning: #d97706;
            --route-info: #0891b2;
            --route-light: #f8fafc;
            --route-dark: #0f172a;
            --route-border: #e2e8f0;
            --route-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --route-shadow-hover: 0 8px 25px rgba(0, 0, 0, 0.15);
            --route-radius: 12px;
            --route-radius-lg: 16px;
            --route-transition: all 0.3s ease;
        }

        body {
            background: var(--route-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main Layout */
        .route-management-container {
            display: grid;
            grid-template-areas:
                "header header header"
                "sidebar workspace map";
            grid-template-columns: 380px 1fr 600px;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 1rem;
            padding: 1rem;
            position: relative;
        }

        /* Resizable Splitter */
        .resize-handle {
            position: absolute;
            top: 80px;
            /* Header yüksekliği + padding */
            right: 620px;
            /* Map genişliği + gap */
            width: 8px;
            height: calc(100vh - 100px);
            background: linear-gradient(90deg, transparent 2px, var(--route-border) 2px, var(--route-border) 6px, transparent 6px);
            cursor: col-resize;
            z-index: 1000;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .resize-handle:hover {
            background: linear-gradient(90deg, transparent 1px, var(--route-primary) 1px, var(--route-primary) 7px, transparent 7px);
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
        }

        .resize-handle.dragging {
            background: linear-gradient(90deg, transparent 1px, var(--route-primary) 1px, var(--route-primary) 7px, transparent 7px);
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
        }

        .resize-handle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 30px;
            background: repeating-linear-gradient(to bottom,
                    var(--route-secondary) 0px,
                    var(--route-secondary) 3px,
                    transparent 3px,
                    transparent 6px);
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .resize-handle:hover::before,
        .resize-handle.dragging::before {
            opacity: 1;
        }

        /* Header */
        .route-header {
            grid-area: header;
            background: white;
            border-radius: var(--route-radius-lg);
            box-shadow: var(--route-shadow);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .route-header h1 {
            margin: 0;
            color: var(--route-dark);
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-navigation {
            display: flex;
            gap: 1rem;
        }

        .main-navigation a {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            text-decoration: none;
            color: var(--route-secondary);
            font-weight: 500;
            transition: var(--route-transition);
            border: 2px solid transparent;
        }

        .main-navigation a.active {
            background: var(--route-primary);
            color: white;
            box-shadow: var(--route-shadow);
        }

        .main-navigation a:hover:not(.active) {
            background: var(--route-light);
            border-color: var(--route-border);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn-primary {
            background: var(--route-primary);
            border: none;
            border-radius: 25px;
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            transition: var(--route-transition);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: var(--route-shadow-hover);
        }

        /* Sidebar */
        .route-sidebar {
            grid-area: sidebar;
            background: white;
            border-radius: var(--route-radius-lg);
            box-shadow: var(--route-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            background: linear-gradient(135deg, var(--route-primary) 0%, #1e40af 100%);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .sidebar-controls {
            padding: 1rem;
            border-bottom: 1px solid var(--route-border);
            background: var(--route-light);
        }

        .search-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 2px solid var(--route-border);
            border-radius: 25px;
            font-size: 0.9rem;
            transition: var(--route-transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--route-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--route-secondary);
        }

        .filter-controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--route-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-select {
            padding: 0.5rem;
            border: 2px solid var(--route-border);
            border-radius: var(--route-radius);
            font-size: 0.85rem;
            transition: var(--route-transition);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--route-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .bulk-actions {
            padding: 1rem;
            border-bottom: 1px solid var(--route-border);
            background: #fef3c7;
            display: none;
        }

        .bulk-actions.show {
            display: block;
        }

        .bulk-actions-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .bulk-count {
            font-weight: 600;
            color: var(--route-warning);
        }

        .bulk-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-bulk {
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: var(--route-transition);
        }

        .btn-bulk-export {
            background: var(--route-info);
            color: white;
        }

        .btn-bulk-delete {
            background: var(--route-danger);
            color: white;
        }

        .btn-bulk-edit {
            background: var(--route-warning);
            color: white;
        }

        /* Route List */
        .route-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .route-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .route-list-container::-webkit-scrollbar-track {
            background: var(--route-light);
            border-radius: 3px;
        }

        .route-list-container::-webkit-scrollbar-thumb {
            background: var(--route-border);
            border-radius: 3px;
        }

        .route-list-container::-webkit-scrollbar-thumb:hover {
            background: var(--route-secondary);
        }

        .route-item {
            background: white;
            border: 2px solid var(--route-border);
            border-radius: var(--route-radius);
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: var(--route-transition);
            position: relative;
        }

        .route-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--route-primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            border-radius: 2px 0 0 2px;
        }

        .route-item:hover {
            border-color: var(--route-primary);
            transform: translateY(-2px);
            box-shadow: var(--route-shadow-hover);
        }

        .route-item:hover::before {
            transform: scaleY(1);
        }

        .route-item.selected {
            border-color: var(--route-primary);
            background: rgba(37, 99, 235, 0.05);
            box-shadow: var(--route-shadow-hover);
        }

        .route-item.selected::before {
            transform: scaleY(1);
        }

        .route-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .route-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-route-info {
            background: none;
            border: none;
            color: var(--route-primary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: var(--route-transition);
            opacity: 0.7;
        }

        .btn-route-info:hover {
            background: rgba(37, 99, 235, 0.1);
            opacity: 1;
            transform: scale(1.1);
        }

        .route-checkbox {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .route-item-title {
            font-weight: 700;
            color: var(--route-dark);
            margin: 0;
            font-size: 1rem;
            line-height: 1.3;
            padding-right: 2rem;
        }

        .route-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .route-type-walking {
            background: #dcfce7;
            color: #166534;
        }

        .route-type-hiking {
            background: #fef3c7;
            color: #92400e;
        }

        .route-type-cycling {
            background: #dbeafe;
            color: #1e40af;
        }

        .route-type-driving {
            background: #fce7f3;
            color: #be185d;
        }

        .route-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin: 0.75rem 0;
        }

        .route-stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--route-secondary);
        }

        .route-stat-icon {
            width: 16px;
            text-align: center;
            color: var(--route-primary);
        }

        .difficulty-stars {
            color: #fbbf24;
            font-size: 0.9rem;
        }

        .route-description {
            font-size: 0.85rem;
            color: var(--route-secondary);
            line-height: 1.4;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Workspace */
        .route-workspace {
            grid-area: workspace;
            background: white;
            border-radius: var(--route-radius-lg);
            box-shadow: var(--route-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .workspace-header {
            background: linear-gradient(135deg, var(--route-secondary) 0%, #475569 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .workspace-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-workspace {
            padding: 0.5rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--route-transition);
        }

        .btn-workspace:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-workspace.btn-danger {
            border-color: rgba(220, 38, 38, 0.5);
            color: #dc2626;
        }

        .btn-workspace.btn-danger:hover {
            background: rgba(220, 38, 38, 0.1);
            border-color: #dc2626;
        }

        .workspace-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .empty-workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--route-secondary);
            text-align: center;
        }

        .empty-workspace i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Map View */
        .route-map-view {
            grid-area: map;
            background: white;
            border-radius: var(--route-radius-lg);
            box-shadow: var(--route-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .map-header {
            background: linear-gradient(135deg, var(--route-success) 0%, #047857 100%);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .map-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .map-controls {
            display: flex;
            gap: 0.5rem;
        }

        .btn-map {
            padding: 0.25rem 0.5rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--route-transition);
        }

        .btn-map:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #routeMap {
            flex: 1;
            min-height: 400px;
            position: relative;
        }

        #routeMap.select-location {
            cursor: crosshair;
        }

        #routeMap.select-location::after {
            content: 'Fotoğraf konumu için haritaya tıklayın';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.875rem;
            pointer-events: none;
            z-index: 1000;
        }

        .route-media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .route-media-card {
            background: white;
            border: 2px solid var(--route-border);
            border-radius: var(--route-radius);
            overflow: hidden;
            position: relative;
            transition: var(--route-transition);
        }

        .route-media-card:hover {
            border-color: var(--route-primary);
            box-shadow: var(--route-shadow-hover);
            transform: translateY(-2px);
        }

        .route-media-thumb {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .route-media-delete {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .route-media-panel {
            background: white;
            border-radius: var(--route-radius);
            border: 2px solid var(--route-border);
            padding: 1rem;
            max-height: 100%;
            overflow-y: auto;
        }

        /* Elevation Chart Container */
        .route-elevation-container {
            background: white;
            border-top: 1px solid var(--route-border);
            padding: 1rem;
        }

        /* Map Fullscreen */
        .route-map-view.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
        }

        body.map-fullscreen {
            overflow: hidden;
        }

        .route-map-view.fullscreen #routeMap {
            min-height: calc(100vh - 60px);
            /* Header yüksekliği çıkarılmış */
        }

        /* Custom POI Map Markers */
        .custom-poi-marker {
            background: transparent !important;
            border: none !important;
        }

        .poi-marker-container {
            width: 35px;
            height: 35px;
            border-radius: 50% 50% 50% 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
            border: 3px solid white;
            transition: transform 0.2s ease;
            position: relative;
            transform: rotate(-45deg);
        }

        .poi-marker-container i {
            transform: rotate(45deg);
            z-index: 2;
        }

        .poi-order-number {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            transform: rotate(45deg);
            border: 2px solid white;
        }

        .poi-marker-container:hover {
            transform: rotate(-45deg) scale(1.1);
            z-index: 1000;
        }

        /* Media location markers */
        .media-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            font-size: 12px;
        }

        .media-marker.image {
            background: #f59e0b;
        }

        .media-marker.video {
            background: #ef4444;
        }

        .media-marker.audio {
            background: #10b981;
        }

        .media-marker.model_3d {
            background: #6366f1;
        }

        /* POI Popup Styles */
        .poi-popup {
            min-width: 200px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .poi-popup-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .poi-popup-category {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            font-style: italic;
        }
        .poi-popup-description {
            color: #444;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }
        .poi-popup-order {
            color: #666;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Photo Location Management Styles */
        .photo-location-management {
            background: #f8f9fa;
            border: 1px solid var(--route-border);
            border-radius: var(--route-radius);
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .photo-location-management .alert {
            margin-bottom: 1rem;
        }

        .photo-location-management .alert h6 {
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .photo-location-management .alert ul {
            margin-bottom: 0;
            padding-left: 1.25rem;
        }

        .photo-location-management .alert li {
            margin-bottom: 0.25rem;
        }

        .photo-location-info {
            margin-bottom: 1rem;
        }

        .photo-location-info p {
            margin: 0;
            font-size: 0.9rem;
        }

        .photo-location-controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .photo-location-controls .btn {
            font-size: 0.8rem;
            padding: 0.375rem 0.75rem;
        }

        /* Media Item Location Styles */
        .media-item-card.has-location {
            border-color: var(--route-success);
            box-shadow: 0 0 0 1px var(--route-success);
        }

        .media-location-info {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--route-border);
        }

        .location-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .location-badge.location-set {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .location-badge.location-missing {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .location-actions {
            display: flex;
            gap: 0.25rem;
            margin-left: auto;
        }

        .location-source-info {
            margin-top: 0.5rem;
            text-align: center;
        }

        .location-source-info small {
            display: block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .location-source-info .text-success {
            background: rgba(5, 150, 105, 0.1);
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .location-source-info .text-muted {
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.2);
        }

        .btn-location-edit,
        .btn-location-add,
        .btn-location-remove {
            background: none;
            border: none;
            padding: 0.125rem 0.25rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--route-transition);
            opacity: 0.7;
        }

        .btn-location-edit:hover,
        .btn-location-add:hover,
        .btn-location-remove:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.1);
        }

        .btn-location-edit {
            color: var(--route-primary);
        }

        .btn-location-add {
            color: var(--route-success);
        }

        .btn-location-remove {
            color: var(--route-danger);
        }

        .webp-conversion-actions {
            margin-top: 0.5rem;
        }

        .webp-conversion-actions .btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .webp-conversion-actions .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .debug-actions {
            margin-top: 0.25rem;
        }

        .debug-actions .btn {
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .debug-actions .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        /* Map Location Selection Styles */
        #routeMap.select-location {
            cursor: crosshair;
        }

        #routeMap.select-location::after {
            content: 'Fotoğraf konumu için haritaya tıklayın';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
        }

        /* Route Details Popup Styles */
        .route-detail-popup {
            padding: 0;
        }

        .route-detail-popup .route-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--route-border);
        }

        .route-detail-popup .route-description-full {
            margin-bottom: 1.5rem;
        }

        .route-detail-popup .route-description-full h6 {
            color: var(--route-primary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .route-detail-popup .route-statistics h6 {
            color: var(--route-primary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .stats-grid-popup {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card-popup {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: var(--route-light);
            border-radius: var(--route-radius);
            border: 1px solid var(--route-border);
        }

        .stat-card-popup .stat-icon {
            margin-right: 0.75rem;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--route-primary);
            color: white;
            border-radius: 50%;
            font-size: 1rem;
        }

        .stat-card-popup .stat-info {
            flex: 1;
        }

        .stat-card-popup .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--route-primary);
            line-height: 1;
        }

        .stat-card-popup .stat-label {
            font-size: 0.8rem;
            color: var(--route-secondary);
            margin-top: 0.25rem;
        }

        .route-detail-popup .route-tags-section h6 {
            color: var(--route-primary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .route-detail-popup .route-metadata h6 {
            color: var(--route-primary);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .metadata-grid-popup {
            display: grid;
            gap: 0.5rem;
        }

        .metadata-grid-popup .metadata-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--route-border);
        }

        .metadata-grid-popup .metadata-item:last-child {
            border-bottom: none;
        }

        /* POI Order Badge */
        .poi-order-badge {
            display: inline-block;
            background: var(--route-primary);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-right: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .route-management-container {
                grid-template-areas:
                    "header header"
                    "sidebar workspace"
                    "map map";
                grid-template-columns: 350px 1fr;
                grid-template-rows: auto 1fr 450px;
            }

            .resize-handle {
                display: none;
                /* Hide splitter on smaller screens */
            }
        }

        @media (max-width: 768px) {
            .route-management-container {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "workspace"
                    "map";
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr 300px;
                padding: 0.5rem;
                gap: 0.5rem;
            }

            .route-header {
                padding: 1rem;
            }

            .route-header h1 {
                font-size: 1.2rem;
            }

            .main-navigation {
                flex-direction: column;
                gap: 0.5rem;
            }

            .header-actions {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Loading States */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--route-border);
            border-top: 4px solid var(--route-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Notifications */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            padding: 1rem;
            border-radius: var(--route-radius);
            box-shadow: var(--route-shadow-hover);
            animation: slideIn 0.3s ease;
        }

        .notification-success {
            background: var(--route-success);
            color: white;
        }

        .notification-error {
            background: var(--route-danger);
            color: white;
        }

        .notification-info {
            background: var(--route-info);
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Upload Progress Modal Styles */
        .upload-progress-container {
            padding: 20px 0;
        }

        .upload-stats {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 500;
        }

        .current-file-info {
            margin: 20px 0;
        }

        .upload-log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .progress {
            height: 25px;
            border-radius: 12px;
            background-color: #e9ecef;
        }

        .progress-bar {
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 25px;
        }
    </style>
</head>
<body>
    <div class="route-management-container" id="routeContainer">
        <!-- Resizable Splitter -->
        <div class="resize-handle" id="resizeHandle"></div>

        <!-- Header -->
        <header class="route-header">
            <h1>
                <i class="fas fa-route"></i>
                Rota Yönetimi
            </h1>
            <nav class="main-navigation">
                <a href="poi_manager_enhanced.html">
                    <i class="fas fa-map-marker-alt me-1"></i>
                    POI Yönetimi
                </a>
                <a href="route_manager_enhanced.html" class="active">
                    <i class="fas fa-route me-1"></i>
                    Rota Yönetimi
                </a>
                <a href="file_import_manager.html">
                    <i class="fas fa-file-import me-1"></i>
                    Dosya Import
                </a>
            </nav>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="createAndEditRoute()">
                    <i class="fas fa-plus me-1"></i>
                    Yeni Rota
                </button>
                <button class="btn btn-outline-secondary" onclick="refreshRoutes()">
                    <i class="fas fa-sync-alt me-1"></i>
                    Yenile
                </button>
                <button class="btn btn-outline-warning" onclick="clearMapRoutes()"
                    title="Haritadaki tüm rotaları temizle">
                    <i class="fas fa-eraser me-1"></i>
                    Haritayı Temizle
                </button>
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="route-sidebar">
            <div class="sidebar-header">
                <h3>
                    <i class="fas fa-list me-2"></i>
                    Rota Listesi
                </h3>
            </div>

            <!-- Search and Filters -->
            <div class="sidebar-controls">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="routeSearch" placeholder="Rota ara..."
                        oninput="handleSearch()">
                </div>

                <div class="filter-controls">
                    <div class="filter-group">
                        <label class="filter-label">
                            <i class="fas fa-filter"></i>
                            Rota Türü
                        </label>
                        <select class="filter-select" id="typeFilter" onchange="applyFilters()">
                            <option value="">Tüm Türler</option>
                            <option value="walking">🚶 Yürüyüş</option>
                            <option value="hiking">🥾 Doğa Yürüyüşü</option>
                            <option value="cycling">🚴 Bisiklet</option>
                            <option value="driving">🚗 Araba</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">
                            <i class="fas fa-star"></i>
                            Zorluk Seviyesi
                        </label>
                        <select class="filter-select" id="difficultyFilter" onchange="applyFilters()">
                            <option value="">Tüm Seviyeler</option>
                            <option value="1">⭐ Çok Kolay</option>
                            <option value="2">⭐⭐ Kolay</option>
                            <option value="3">⭐⭐⭐ Orta</option>
                            <option value="4">⭐⭐⭐⭐ Zor</option>
                            <option value="5">⭐⭐⭐⭐⭐ Çok Zor</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">
                            <i class="fas fa-clock"></i>
                            Maksimum Süre
                        </label>
                        <select class="filter-select" id="durationFilter" onchange="applyFilters()">
                            <option value="">Süre Sınırı Yok</option>
                            <option value="30">30 dakika</option>
                            <option value="60">1 saat</option>
                            <option value="120">2 saat</option>
                            <option value="240">4 saat</option>
                            <option value="480">8 saat</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">
                            <i class="fas fa-sort"></i>
                            Sıralama
                        </label>
                        <select class="filter-select" id="sortFilter" onchange="applyFilters()">
                            <option value="name_asc">İsim (A-Z)</option>
                            <option value="name_desc">İsim (Z-A)</option>
                            <option value="created_desc">En Yeni</option>
                            <option value="created_asc">En Eski</option>
                            <option value="difficulty_asc">Kolay → Zor</option>
                            <option value="difficulty_desc">Zor → Kolay</option>
                            <option value="duration_asc">Kısa → Uzun</option>
                            <option value="duration_desc">Uzun → Kısa</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="bulk-actions" id="bulkActions">
                <div class="bulk-actions-header">
                    <span class="bulk-count" id="bulkCount">0 rota seçildi</span>
                    <button class="btn-bulk btn-bulk-clear" onclick="clearSelection()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="bulk-buttons">
                    <button class="btn-bulk btn-bulk-export" onclick="exportSelected()">
                        <i class="fas fa-download me-1"></i>
                        Dışa Aktar
                    </button>
                    <button class="btn-bulk btn-bulk-edit" onclick="bulkEdit()">
                        <i class="fas fa-edit me-1"></i>
                        Toplu Düzenle
                    </button>
                    <button class="btn-bulk btn-bulk-delete" onclick="deleteSelected()">
                        <i class="fas fa-trash me-1"></i>
                        Sil
                    </button>
                </div>
            </div>

            <!-- Route List -->
            <div class="route-list-container" id="routeListContainer">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            </div>
        </aside>

        <!-- Workspace -->
        <main class="route-workspace">
            <div class="workspace-header">
                <h3 class="workspace-title" id="workspaceTitle">Rota Detayları</h3>
                <div class="workspace-actions" id="workspaceActions" style="display: none;">
                    <button class="btn-workspace" onclick="editCurrentRoute()">
                        <i class="fas fa-edit me-1"></i>
                        Düzenle
                    </button>
                    <button class="btn-workspace" onclick="duplicateCurrentRoute()">
                        <i class="fas fa-copy me-1"></i>
                        Kopyala
                    </button>
                    <button class="btn-workspace" onclick="exportCurrentRoute()">
                        <i class="fas fa-download me-1"></i>
                        Dışa Aktar
                    </button>
                    <button class="btn-workspace btn-danger" onclick="deleteCurrentRoute()">
                        <i class="fas fa-trash me-1"></i>
                        Sil
                    </button>
                    <button class="btn-workspace" onclick="clearRouteSelection()" title="Rota seçimini temizle">
                        <i class="fas fa-times me-1"></i>
                        Seçimi Temizle
                    </button>
                </div>
            </div>
            <div class="workspace-content" id="workspaceContent">
                <div class="empty-workspace">
                    <i class="fas fa-route"></i>
                    <h4>Rota Seçin</h4>
                    <p>Detayları görüntülemek için sol taraftan bir rota seçin</p>
                </div>
            </div>
        </main>

        <!-- Map View -->
        <section class="route-map-view">
            <div class="map-header">
                <h3 class="map-title" id="mapTitle">
                    <i class="fas fa-map me-2"></i>
                    Harita Görünümü
                </h3>
                <div class="map-controls">
                    <button class="btn-map" onclick="toggleMapLayer('satellite')" title="Uydu Görünümü">
                        <i class="fas fa-satellite"></i>
                    </button>
                    <button class="btn-map" onclick="toggleMapLayer('terrain')" title="Arazi Görünümü">
                        <i class="fas fa-mountain"></i>
                    </button>
                    <button class="btn-map" onclick="fitMapToRoutes()" title="Rotalara Odaklan">
                        <i class="fas fa-expand-arrows-alt"></i>
                    </button>
                    <button class="btn-map" onclick="toggleMapFullscreen()" title="Tam Ekran" id="fullscreenBtn">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
            <div id="routeMap" tabindex="-1"></div>
            <!-- Elevation Chart Container -->
            <div class="route-elevation-container">
                <div id="routeElevationChartContainer" class="elevation-chart-hidden"></div>
            </div>
        </section>
    </div>



    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="static/js/map-layer-control.js"></script>
    <script src="static/js/rate-limiter.js"></script>
    <script src="static/js/elevation-chart.js"></script>
    <script src="static/js/api-client.js"></script>
    <script src="static/js/navigation-manager.js"></script>
    <script src="static/js/route-admin-manager.js"></script>
    <script src="static/js/route-manager-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="static/js/route-manager-media.js"></script>
    <script src="static/js/route-manager-photo-locations.js"></script>
    <script src="static/js/route-manager-associations.js"></script>
    <script src="static/js/route-manager-details.js"></script>
    <script src="static/js/route-manager-workspace.js"></script>
    <script src="static/js/route-manager-coordinates.js"></script>
    <script src="static/js/route-manager-map-focus.js"></script>
    <script src="static/js/route-manager-core.js"></script>
    <script src="static/js/route-manager-shell.js"></script>
    <script src="static/js/route-manager-actions.js"></script>

    <script>
        // Yönetim arayüzü için RouteAdminManager'ı başlat
        if (window.RouteAdminManager) {
            window.routeAdminManager = new RouteAdminManager('routeContainer');

            // Eski kod ile uyumluluk için loadRouteMedia fonksiyonunu yayınla
            window.loadRouteMedia = (routeId) =>
                window.routeAdminManager.loadRouteMedia(routeId);
        }

        // Global variables
        const apiBase = '/api';
        let allRoutes = [];
        let filteredRoutes = [];
        let selectedRoutes = new Set();
        let currentRoute = null;
        let map = null;
        let routeLayers = {};
        let poiMarkersLayer = null;
        let searchTimeout = null;
        let csrfToken = null;
        let defaultWorkspaceActionsHTML = '';

        // Route type configurations
        const ROUTE_TYPES = {
            'walking': { name: 'Yürüyüş', icon: '🚶', color: '#059669' },
            'hiking': { name: 'Doğa Yürüyüşü', icon: '🥾', color: '#d97706' },
            'cycling': { name: 'Bisiklet', icon: '🚴', color: '#2563eb' },
            'driving': { name: 'Araba', icon: '🚗', color: '#dc2626' }
        };

        // POI Category configurations
        const POI_CATEGORIES = {
            'kulturel_miras': { name: '🏛️ Kültürel Miras', icon: 'landmark', color: '#8B4513' },
            'dogal_miras': { name: '🌿 Doğal Miras', icon: 'mountain', color: '#228B22' },
            'yasayan_kultur': { name: '🎨 Yaşayan Kültür', icon: 'palette', color: '#9932CC' },
            'gastronomi': { name: '🍽️ Gastronomi', icon: 'utensils', color: '#DC143C' },
            'konaklama_hizmet': { name: '🏨 Konaklama & Hizmetler', icon: 'bed', color: '#4169E1' },
            'macera_spor': { name: '🏃 Macera & Spor', icon: 'hiking', color: '#FF6347' },
            'seyir_noktalari': { name: '📷 Seyir Noktaları', icon: 'camera', color: '#ff9500' }
        };

        // Initialize application
        document.addEventListener('DOMContentLoaded', function () {
            initializeMap();
            loadRoutes();
            setupEventListeners();
            setupResizableMap();
            const workspaceActionsElem = document.getElementById('workspaceActions');
            defaultWorkspaceActionsHTML = workspaceActionsElem.innerHTML;
            // Fetch CSRF token for admin POSTs
            fetch('/auth/csrf-token', { credentials: 'include' })
                .then(r => r.ok ? r.json() : null)
                .then(d => { if (d?.csrf_token) csrfToken = d.csrf_token; })
                .catch(() => { });

            // Show info about automatic EXIF extraction
            setTimeout(() => {
                showNotification('📸 Otomatik EXIF konum çıkarma aktif! Fotoğraf yüklediğinizde GPS bilgisi otomatik olarak haritaya eklenir.', 'info');
            }, 2000);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function () {
            if (window.routeElevationChart) {
                window.routeElevationChart.destroy();
                window.routeElevationChart = null;
            }
        });
    </script>
</body>

</html>
